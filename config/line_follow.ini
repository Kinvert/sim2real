ambiguous_turn_penalty_scale = 0.25
steering_correction_scale = 0.220266898186265
turn_speed_penalty_scale = 0.04691574275276386
min_turn_outer_action = 0.6995976230130777
time_penalty = 0.005289319291768263
idle_penalty = 0.008
min_wheel_action = 0.35740649475096264
reverse_penalty_scale = 0.05
too_far_m = 0.09
track_complete_margin_m = 0.02
sensor_forward_m = 0.0435
sensor_side_lateral_m = 0.018
sensor_lateral_center_m = 0.0
sensor_lateral_jitter_m = 0.004
sensor_forward_jitter_m = 0.003
sensor_noise_std = 10.0
qti_threshold = 0.15
qti_white_time = 80.0
qti_black_time = 403.0
