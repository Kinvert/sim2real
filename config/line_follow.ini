[base]
env_name = line_follow

[vec]
total_agents = 4096
num_buffers = 4
num_threads = 16

[env]
dt = 0.0010
dt_min = 0.0010
dt_max = 0.0015
max_steps = 5200
max_wheel_speed_mps = 0.260
firmware_loop_ms = 0
wheel_base_m = 0.125
body_ahead_m = 0.040
body_behind_m = 0.090
body_width_m = 0.075
tire_diameter_m = 0.065
tire_width_m = 0.012
motor_lag_alpha = 0.65
command_deadband = 0.0631585622560529
min_drive_ticks_per_sec = 20
left_speed_scale = 1.0
right_speed_scale = 1.0
lost_line_limit = 156
track_family = -1
max_track_gen_attempts = 4
policy_hidden_size = 8
policy_num_layers = 0
model_dt_enabled = 0
progress_reward_scale = 1.0
centerline_penalty_scale = 0.0
centerline_reward_interval_m = 0.010
success_reward = 1.0
heading_penalty_scale = 0.0
lost_line_penalty = 0.03
off_track_terminal_penalty = 1.0
action_smoothness_penalty = 0.0
action_bound_penalty_scale = 0.01
turn_penalty_scale = 0.0
steering_correction_scale = 0.30
turn_speed_penalty_scale = 0.05
min_turn_outer_action = 0.65
time_penalty = 0.005
idle_penalty = 0.02
min_wheel_action = 0.35
reverse_penalty_scale = 0.2
too_far_m = 0.09
track_complete_margin_m = 0.02
sensor_forward_m = 0.0435
sensor_side_lateral_m = 0.018
sensor_lateral_jitter_m = 0.004
sensor_forward_jitter_m = 0.003
sensor_noise_std = 10.0
qti_threshold = 0.5
qti_white_time = 40.0
qti_black_time = 350.0
qti_white_jitter = 25.0
qti_black_jitter = 120.0
qti_timeout = 2500.0
line_width_m = 0.018
line_width_jitter_m = 0.006
line_width_segment_jitter_m = 0.002
line_edge_softness_m = 0.006
line_edge_softness_jitter_m = 0.004
line_reflectance_noise = 0.12
track_bounds_m = 1.0
start_lateral_offset_m = 0.025
start_heading_offset_rad = 0.261799

[policy]
hidden_size = 8
num_layers = 0
expansion_factor = 1

[torch]
network = MLP
encoder = DefaultEncoder
decoder = DefaultDecoder

[train]
gpus = 1
seed = 42
total_timesteps = 100000000
learning_rate = 0.0012
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.98
gae_lambda = 0.97
replay_ratio = 1
clip_coef = 0.24
vf_coef = 0.5
vf_clip_coef = 1.0
max_grad_norm = 0.5
ent_coef = 0.003
beta1 = 0.9
beta2 = 0.999
eps = 1e-8
minibatch_size = 8192
horizon = 64
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.5
prio_beta0 = 0.5

[sweep]
method = Protein
metric = perf
goal = maximize
use_gpu = False
sweep_only = train/total_timesteps,train/learning_rate,train/ent_coef,train/gamma,train/gae_lambda,train/clip_coef,env/max_wheel_speed_mps,env/motor_lag_alpha,env/command_deadband,env/min_drive_ticks_per_sec,env/progress_reward_scale,env/centerline_reward_interval_m,env/centerline_penalty_scale,env/heading_penalty_scale,env/lost_line_limit,env/lost_line_penalty,env/off_track_terminal_penalty,env/action_bound_penalty_scale,env/success_reward,env/steering_correction_scale,env/turn_speed_penalty_scale,env/min_turn_outer_action,env/time_penalty,env/idle_penalty,env/min_wheel_action,env/reverse_penalty_scale,env/line_reflectance_noise

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 2
max = 8
mean = 8
scale = 1

[sweep.train.total_timesteps]
distribution = log_normal
min = 80000000
max = 140000000
scale = time

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0007
max = 0.0018
scale = auto

[sweep.train.ent_coef]
