[base]
env_name = line_follow

[vec]
total_agents = 4096
num_buffers = 4
num_threads = 16

[env]
dt = 0.065
dt_min = 0.045
dt_max = 0.090
max_steps = 800
max_wheel_speed_mps = 0.010
firmware_loop_ms = 25
wheel_base_m = 0.125
body_ahead_m = 0.040
body_behind_m = 0.090
body_width_m = 0.075
tire_diameter_m = 0.065
tire_width_m = 0.012
motor_lag_alpha = 0.65
command_deadband = 0.04
left_speed_scale = 1.0
right_speed_scale = 1.0
lost_line_limit = 16
track_family = -1
max_track_gen_attempts = 4
policy_hidden_size = 8
policy_num_layers = 0
model_dt_enabled = 1
progress_reward_scale = 2.0
centerline_penalty_scale = 0.0
centerline_reward_interval_m = 0.025
centerline_reward_scale = 1.0
success_reward = 1.0
heading_penalty_scale = 0.05
lost_line_penalty = 0.04
action_smoothness_penalty = 0.015
turn_penalty_scale = 0.0025
time_penalty = 0.02
idle_penalty = 0.02
min_wheel_action = 0.08
reverse_penalty_scale = 0.2
too_far_m = 0.09
track_complete_margin_m = 0.02
sensor_forward_m = 0.045
sensor_inner_lateral_m = 0.020
sensor_outer_lateral_m = 0.040
sensor_lateral_jitter_m = 0.0025
sensor_forward_jitter_m = 0.0025
sensor_noise_std = 10.0
qti_threshold = 0.5
qti_white_time = 40.0
qti_black_time = 350.0
qti_white_jitter = 25.0
qti_black_jitter = 120.0
qti_timeout = 2500.0
line_width_m = 0.018
line_width_jitter_m = 0.004
line_edge_softness_m = 0.006
line_edge_softness_jitter_m = 0.004
track_bounds_m = 1.0
start_lateral_offset_m = 0.050
start_heading_offset_rad = 0.12

[policy]
hidden_size = 8
num_layers = 0
expansion_factor = 1

[torch]
network = MLP
encoder = DefaultEncoder
decoder = DefaultDecoder

[train]
gpus = 1
seed = 42
total_timesteps = 200000000
learning_rate = 0.001
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.98
gae_lambda = 0.95
replay_ratio = 1
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 1.0
max_grad_norm = 0.5
ent_coef = 0.001
beta1 = 0.9
beta2 = 0.999
eps = 1e-8
minibatch_size = 8192
horizon = 64
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.5
prio_beta0 = 0.5

[sweep]
method = Protein
metric = perf
goal = maximize
use_gpu = False
sweep_only = policy/hidden_size,policy/num_layers,train/learning_rate,train/ent_coef,train/gamma,train/gae_lambda,train/clip_coef,env/progress_reward_scale,env/centerline_penalty_scale,env/centerline_reward_scale,env/heading_penalty_scale,env/lost_line_penalty,env/action_smoothness_penalty,env/turn_penalty_scale,env/time_penalty,env/idle_penalty

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 2
max = 8
mean = 4
scale = 1

[sweep.policy.num_layers]
distribution = int_uniform
min = 0
max = 1
mean = 0
scale = 1

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0002
max = 0.003
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.00001
max = 0.003
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.90
max = 0.995
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.80
max = 0.98
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.08
max = 0.30
scale = auto

[sweep.env.progress_reward_scale]
distribution = uniform
min = 1.0
max = 4.0
scale = auto

[sweep.env.centerline_penalty_scale]
distribution = uniform
min = 0.0
max = 4.0
scale = auto

[sweep.env.centerline_reward_scale]
distribution = uniform
min = 0.25
max = 3.0
scale = auto

[sweep.env.heading_penalty_scale]
distribution = uniform
min = 0.0
max = 0.25
scale = auto

[sweep.env.lost_line_penalty]
distribution = uniform
min = 0.01
max = 0.10
scale = auto

[sweep.env.action_smoothness_penalty]
distribution = uniform
min = 0.0
max = 0.05
scale = auto

[sweep.env.turn_penalty_scale]
distribution = uniform
min = 0.0
max = 0.01
scale = auto

[sweep.env.time_penalty]
distribution = uniform
min = 0.005
max = 0.05
scale = auto

[sweep.env.idle_penalty]
distribution = uniform
min = 0.005
max = 0.05
scale = auto
