[base]
env_name = line_follow

[vec]
total_agents = 4096
num_buffers = 4
num_threads = 16

[env]
dt = 0.05
max_steps = 600
max_wheel_speed_mps = 0.35
wheel_base_m = 0.125
body_ahead_m = 0.040
body_behind_m = 0.090
body_width_m = 0.075
tire_diameter_m = 0.065
tire_width_m = 0.012
motor_lag_alpha = 0.65
command_deadband = 0.04
left_speed_scale = 1.0
right_speed_scale = 1.0
lost_line_limit = 30
track_family = -1
max_track_gen_attempts = 4
progress_reward_scale = 8.0
centerline_penalty_scale = 4.0
heading_penalty_scale = 0.05
lost_line_penalty = 0.04
action_smoothness_penalty = 0.015
reverse_penalty_scale = 0.2
too_far_m = 0.09
track_complete_margin_m = 0.06
sensor_forward_m = 0.035
sensor_inner_lateral_m = 0.020
sensor_outer_lateral_m = 0.040
sensor_lateral_jitter_m = 0.002
sensor_forward_jitter_m = 0.002
sensor_noise_std = 10.0
qti_threshold = 0.5
qti_white_time = 100.0
qti_black_time = 1100.0
qti_timeout = 2000.0
line_width_m = 0.018
line_edge_softness_m = 0.006
track_bounds_m = 1.0
start_lateral_offset_m = 0.015
start_heading_offset_rad = 0.12

[policy]
hidden_size = 16
num_layers = 1
expansion_factor = 1

[torch]
network = MLP
encoder = DefaultEncoder
decoder = DefaultDecoder

[train]
gpus = 1
seed = 42
total_timesteps = 200000000
learning_rate = 0.001
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.98
gae_lambda = 0.95
replay_ratio = 1
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 1.0
max_grad_norm = 0.5
ent_coef = 0.001
beta1 = 0.9
beta2 = 0.999
eps = 1e-8
minibatch_size = 8192
horizon = 64
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.5
prio_beta0 = 0.5

[sweep]
method = Protein
metric = perf
goal = maximize

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 8
max = 64
mean = 16
scale = auto

[sweep.policy.num_layers]
distribution = int_uniform
min = 0
max = 2
mean = 1
scale = auto
