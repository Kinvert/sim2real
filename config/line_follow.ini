track_bounds_m = 1.0
start_lateral_offset_m = 0.025
start_heading_offset_rad = 0.261799

[policy]
hidden_size = 4
num_layers = 1
expansion_factor = 1

[torch]
network = MLP
encoder = DefaultEncoder
decoder = DefaultDecoder

[train]
gpus = 1
seed = 42
total_timesteps = 140000000
learning_rate = 0.001640763753362469
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.975
gae_lambda = 0.94
replay_ratio = 1
clip_coef = 0.2833772160525295
vf_coef = 0.5
vf_clip_coef = 1.0
max_grad_norm = 0.5
ent_coef = 0.0040
beta1 = 0.9
beta2 = 0.999
eps = 1e-8
minibatch_size = 8192
horizon = 64
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.5
prio_beta0 = 0.5

[sweep]
method = Protein
metric = perf
goal = maximize
use_gpu = False
sweep_only = train/total_timesteps,train/learning_rate,train/ent_coef,train/gamma,train/gae_lambda,train/clip_coef,env/max_wheel_speed_mps,env/motor_lag_alpha,env/command_deadband,env/min_drive_ticks_per_sec,env/avg_speed_perf_target_mps,env/progress_reward_scale,env/centerline_reward_interval_m,env/centerline_penalty_scale,env/heading_penalty_scale,env/lost_line_limit,env/lost_line_penalty,env/action_bound_penalty_scale,env/action_smoothness_penalty,env/success_reward,env/turn_penalty_scale,env/ambiguous_turn_penalty_scale,env/steering_correction_scale,env/turn_speed_penalty_scale,env/min_turn_outer_action,env/time_penalty,env/idle_penalty,env/min_wheel_action,env/reverse_penalty_scale,env/qti_threshold,env/line_reflectance_noise

[sweep.train.total_timesteps]
