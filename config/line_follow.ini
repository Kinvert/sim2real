avg_speed_perf_target_mps = 0.18
left_speed_scale = 1.0
right_speed_scale = 1.0
lost_line_limit = 13
track_family = -1
max_track_gen_attempts = 4
policy_hidden_size = 4
policy_num_layers = 1
model_dt_enabled = 1
progress_reward_scale = 0.85
centerline_penalty_scale = 4.380043316224447e-05
centerline_reward_interval_m = 0.009347185969525568
success_reward = 1.087237062111516
heading_penalty_scale = 0.0003585185775216933
lost_line_penalty = 0.01
off_track_terminal_penalty = 1.0
action_smoothness_penalty = 0.0
